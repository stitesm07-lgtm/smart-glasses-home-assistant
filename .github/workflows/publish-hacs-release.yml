name: Publish Smart Glasses release to HACS

on:
  push:
    branches: [main]
    paths:
      - custom_components/smart_glasses/manifest.json
      - .github/workflows/publish-hacs-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smart-glasses-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("custom_components/smart_glasses/manifest.json"))["version"])')
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish tag and release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; publishing its release."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          gh release create "$TAG" --title "Stitchell Glass $TAG" --notes "Smart Glasses Home Assistant integration $TAG. Install or update through HACS." --verify-tag
